[tool.ruff]
line-length = 100
target-version = "py312"
# código herdado do PI: continua como foi validado, sem reformatação
extend-exclude = ["legado"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "SIM", "RET", "C90", "PLR"]
# nomes em português: DadosInvalidos e CasoNaoEncontrado em vez do sufixo Error
ignore = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["legado", "sira"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
